        - generic [ref=e81]:
          - generic [ref=e83]:
            - img "Logo do programa bem viver" [ref=e85]
            - generic [ref=e86]:
              - heading "Bem Viver" [level=4] [ref=e87]
              - paragraph [ref=e88]: Promover qualidade de vida e autonomia aos participantes com deficiência é o objetivo do Programa Bem Viver. Com ele, cada indivíduo possui atenção focada em suas necessidades de saúde específicas, com foco no cuidado integral. Com isso, além do bem-estar ligado à saúde, o Programa promove, também, a independência e a inserção social.
              - paragraph [ref=e89]:
                - link "Saiba mais" [ref=e92] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/programabemviver/
          - generic [ref=e94]:
            - img "LOGO CASSI PLANO IDADE" [ref=e96]
            - generic [ref=e97]:
              - heading "Plena Idade" [level=4] [ref=e98]
              - paragraph [ref=e99]: Passar pelo processo de envelhecimento de forma tranquila e com qualidade de vida é possível e o Programa Plena Idade foi pensado para apoiar as pessoas acima de 60 anos neste processo. A intenção do Programa é de preservar a capacidade funcional do idoso, garantindo autonomia e a conservação das capacidades físicas e mentais durante o maior tempo possível.
              - paragraph [ref=e100]:
                - link "Saiba mais" [ref=e103] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/programaplenaidade/
          - generic [ref=e105]:
            - img "logo atenção domiciliar" [ref=e107]
            - generic [ref=e108]:
              - heading "Programa de Atenção Domiciliar (PAD)" [level=4] [ref=e109]
              - paragraph [ref=e110]: "Pensado para oferecer assistência aos participantes que necessitam de atendimento em casa, o Programa de Atenção Domiciliar (PAD) possui duas modalidades de atendimento: assistência e internação. Nossa equipe especializada analisa as necessidades de cada participante e indica o modelo que mais atende as características essenciais ao tratamento."
              - paragraph [ref=e111]: "*Consulte a cobertura do seu plano"
              - paragraph [ref=e112]:
                - link "Saiba mais" [ref=e115] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/pad/
          - generic [ref=e117]:
            - img "logo saúde mental" [ref=e119]
            - generic [ref=e120]:
              - heading "Programa de Saúde Mental" [level=4] [ref=e121]
              - paragraph [ref=e122]: Focado em participantes em situação de risco de adoecimento ou agravamento mental, o Programa de Saúde Mental direciona atenção à saúde de pessoas com transtornos mentais, sofrimento psíquico ou dependência em álcool, tabaco e outras drogas.
              - paragraph [ref=e123]:
                - link "Saiba mais" [ref=e126] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/programasaudemental/
          - generic [ref=e128]:
            - img "logo viva coração" [ref=e130]
            - generic [ref=e131]:
              - heading "Viva Coração" [level=4] [ref=e132]
              - paragraph [ref=e133]: Desenvolvido para incentivar o cuidado com a saúde cardiovascular, o Programa Viva Coração trabalha para instruir participantes e familiares sobre a importância do controle e estabilização do risco cardiovascular (RCV). Outro foco do Viva Coração é incentivar hábitos saudáveis a fim de reduzir o risco cardiovascular e, consequentemente, promover uma maior qualidade de vida.
              - paragraph [ref=e134]:
                - link "Saiba mais" [ref=e137] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/programavivacoracao/
          - generic [ref=e139]:
            - img "logo programa de assistência" [ref=e141]
            - generic [ref=e142]:
              - heading "Programa de Assistência Farmacêutica da CASSI (PAF)" [level=4] [ref=e143]
              - paragraph [ref=e144]: Criado para promover o acesso a materiais e medicamentos de uso contínuo, o nosso Programa de Assistência Farmacêutica (PAF) é um benefício que busca auxiliar os participantes do Plano Associados que possuem condições crônicas que necessitam de tais insumos.
              - paragraph [ref=e145]:
                - link "Saiba mais" [ref=e148] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/paf/
          - generic [ref=e152]:
            - heading "Programa FlorescerTrans" [level=4] [ref=e153]
            - paragraph [ref=e154]: Oferece cuidado integral, seguro e acolhedor para pessoas trans, travestis e com vivências de variabilidade de gênero. Com equipes especializadas nas CliniCASSI e serviços parceiros de Atenção Primária à Saúde, o programa garante acesso à hormonização e apoio psicossocial, respeitando identidades e priorizando o bem-estar.
            - paragraph [ref=e155]:
              - link "Saiba mais" [ref=e158] [cursor=pointer]:
                - /url: https://www.cassi.com.br/clinicassi/programaflorescer/
            - paragraph [ref=e159]
          - generic [ref=e161]:
            - img "logo gerenciamento de crônicos" [ref=e163]
            - generic [ref=e164]:
              - heading "Gerenciamento de Condições Crônicas – GCC" [level=4] [ref=e165]
              - paragraph [ref=e166]: Fazendo parte da Atenção Primária de Saúde (APS), o Programa de Gerenciamento de Condições Crônicas (GCC) busca oferecer cuidados específicos e ajustados as necessidades dos participantes com condições crônicas.
              - paragraph [ref=e167]: O atendimento é realizado visando acompanhar a evolução da estabilização das condições de saúde por meio de uma equipe de multiprofissionais. Os participantes do GCC contam, também, com o apoio de telemonitoramento para mudança do estilo de vida.
              - paragraph [ref=e168]:
                - link "Saiba mais" [ref=e171] [cursor=pointer]:
                  - /url: https://www.cassi.com.br/clinicassi/gcc/
          - generic [ref=e173]:
            - img "logo Cassi saúde do trabalhador" [ref=e175]
            - generic [ref=e176]:
              - heading "Saúde do trabalhador" [level=4] [ref=e177]
              - paragraph [ref=e178]: "Focados em cuidar da saúde de maneira integral, atendemos a dois programas, executados por meio de convênio com o Banco do Brasil, voltados para a saúde do trabalhador: o Programa de Controle Médico de Saúde Ocupacional (PCMSO), que realiza exames preventivos em todo território nacional, e o Programa de Assistência às Vítimas de Assaltos e Sequestro (Pavas)."
              - paragraph [ref=e179]: Por meio do Pavas, funcionários, clientes e familiares envolvidos em ocorrências de assaltos e sequestro relacionadas ao BB recebem apoio médico e psicológico, por meio de nossos profissionais ou de credenciados, dentro de até 48 horas após o incidente. Além disso, as vítimas contam com assistência médica, hospitalar e psicológica por até 180 após o incidente.
