                      - paragraph [ref=e311]:
                        - generic [ref=e313]: INTERVENÇÃO
                      - paragraph [ref=e314]:
                        - generic [ref=e315]: Em alinhamento com às recomendações da OMS, aplicamos uma abordagem robusta de pesquisa e monitoramento para mapear a saúde social da sua empresa, ajudando sua organização a compreender o cenário real e a articular uma estratégia baseada em dados, com um plano de ação consistente e focado em resultados de impacto profundo.
