                      - paragraph [ref=e258]:
                        - generic [ref=e260]: "NECESSIDADE:"
                      - paragraph [ref=e261]:
                        - generic [ref=e263]: Solidão, esgotamento relacional e relacionamentos tóxicos ainda são tratados como grandes tabus nas organizações. A falta de linguagem para abordar o tema funciona como um fator de risco invisível para o aumento do turnover e a baixa performance e para a dificuldade de posicionar saúde social como uma questão estratégica nas empresas.
                      - paragraph [ref=e264]:
                        - generic [ref=e266]: INTERVENÇÃO
                      - paragraph [ref=e267]:
                        - generic [ref=e268]: Campanhas aumentam a conscientização individual aumentando a capacidade das pessoas de identificar, comunicar, procurar ajuda e adotar ações práticas de fomento a saúde social. Campanhas também geram mobilização coletiva e influenciam políticas e transformações mais estruturais nas organizações.
                      - link "Saber mais" [ref=e270] [cursor=pointer]:
