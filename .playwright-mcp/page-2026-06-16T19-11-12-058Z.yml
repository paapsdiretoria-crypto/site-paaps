                        - generic [ref=e225]: "NECESSIDADE:"
                      - paragraph [ref=e226]:
                        - generic [ref=e227]: Lideranças e profissionais de RH são constantemente cobrados para engajar times e mediar conflitos, mas frequentemente carecem da inteligência relacional e de embasamento para sustentar interações de qualidade diante da complexidade das relações no cenário atual.
                      - paragraph [ref=e228]:
                        - generic [ref=e230]: INTERVENÇÃO
                      - paragraph [ref=e231]:
                        - generic [ref=e232]: Inteligência relacional é a capacidade de sustentar as qualidades que ajudam na manutenção e adaptação de relacionamentos e interações de qualidade. Nossas capacitações oferecem um conhecimento científico e sensível das relações humanas entregando linguagem e ferramentas para que lideranças saibam cultivar e proteger a saúde social nos seus contextos de atuação.
                      - link "Saber mais" [ref=e234] [cursor=pointer]:
