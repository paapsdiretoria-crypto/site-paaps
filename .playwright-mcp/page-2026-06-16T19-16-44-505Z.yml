        - generic [ref=e86]:
          - heading "Saúde mental com propósito, cuidado e estratégia" [level=1] [ref=e89]
          - generic [ref=e91]: O Programa do Bem-estar Mental (B.E.M.) do Einstein une educação, cuidado especializado e gestão estratégica para promover saúde mental com profundidade e continuidade nas organizações. Além de consultas com psicólogos e psiquiatras, o programa oferece ações de sensibilização, apoio à liderança e monitoramento de riscos psicossociais, em conformidade com a NR-1. Uma abordagem completa que fortalece a cultura organizacional e contribui para ambientes mais saudáveis, seguros e produtivos. Preencha o formulário e agende uma conversa com nosso time para entender como levar esse cuidado para a sua empresa.
