                  - 'img "Tudo começou em 2024, no Palácio das Artes. Em 2025, levamos acessibilidade para Congonhas. Agora, 2026 é o ano do Cidade Inclusiva: um movimento que chega a quatro cidades mineiras. Com legado estrutural e festival gratuito, onde pessoas com deficiência são quem comanda a festa. Junho e julho. A história continua. #TextoAlternativo Imagem que mescla registros do Cidade Inclusiva em três momentos: 2024 no Palácio das Artes (BH), 2025 em Congonhas e 2026, com a equipe de consultores nas quatro cidades mineiras atendidas: Caratinga, Pará de Minas, Três Marias e Jaboticatubas. A composição destaca artistas com deficiência em cena e diversos recursos de acessibilidade: mapa tátil, piso tátil, espaço reservado para cadeira de rodas e rampa." [ref=e474]'
