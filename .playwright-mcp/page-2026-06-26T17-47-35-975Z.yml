                    - generic:
                      - generic:
                        - img "Clipe"
                - 'link "Congonhas deu mais um importante passo rumo à inclusão e à acessibilidade. ♿✨ A Prefeitura realizou, nesta terça-feira (13), a cerimônia de entrega oficial das melhorias de acessibilidade estrutural em quatro importantes equipamentos culturais da cidade: Museu de Congonhas, Centro Cultural da Romaria, Teatro Dom Silvério e Santuário do Bom Jesus de Matosinhos. As intervenções incluem pisos e mapas táteis, sinalização em braile e linguagem universal, espaços para cadeirantes e uma rampa móvel que permitirá, pela primeira vez, o acesso autônomo de cadeirantes à Basílica do Senhor Bom Jesus. As ações fazem parte do projeto Festival Palácio Para Todos Itinerante, realizado com apoio da Prefeitura de Congonhas, patrocínio da Cemig e execução da Cultura Criativa. Mais inclusão, autonomia e acesso à cultura para todos. Carrossel" [ref=e477] [cursor=pointer]':
