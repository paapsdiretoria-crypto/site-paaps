              - paragraph [ref=e173]: Design for social innovation can find in the design schools a major driver for its application and diffusion. In fact, design schools can orient their didactic and research activities towards social innovation. They can become design laboratories where new visions are generated, new tools are defined and tested and where new projects are started and supported.
