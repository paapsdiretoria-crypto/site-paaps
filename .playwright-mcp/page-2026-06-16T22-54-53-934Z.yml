                  - paragraph [ref=e187]: Today, social innovation is generating a constellation of small initiatives. Every month we will update the Projects of the month section and your project could be featured! Don’t forget to keep updating your DESIS Lab page with your projects, so that we can see them and promote them.
                - generic [ref=e189]:
                  - heading "DO RESEARCH WITH US" [level=3] [ref=e192]
                  - paragraph [ref=e195]: "If a worldwide movement towards sustainability calls for the best possible use of all existing resources, design schools, with all their potential in terms of students’ enthusiasm and faculty experience, should be considered a very promising social resource: a potentially powerful promoter of sustainable change."
