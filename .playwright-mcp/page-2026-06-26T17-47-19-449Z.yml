                      - text: “CIDADE INCLUSIVA” LEVA ARTE ACESSÍVEL, INCLUSÃO E CULTURA A CARATINGA
                      - text: Nos dias 26 e 27 de junho, Caratinga recebe a primeira edição do projeto Cidade Inclusiva, iniciativa que promove cultura acessível, protagonismo de pessoas com deficiência e melhorias estruturais em equipamentos culturais. Com patrocínio da Cemig e realização da Cultura Criativa, o festival terá programação gratuita.
                      - text: O destaque é a exposição tátil “Tocar e Sentir”, da artista Eni D’Carvalho, referência nacional e internacional em arte acessível, com quase 30 anos de atuação e exposições realizadas até em espaços ligados à ONU.
                      - text: Além da programação artística, o projeto implantará recursos como piso tátil, mapa acessível, sinalização em braile e adequações visuais na Casa Ziraldo de Cultura. Segundo os organizadores, o objetivo é transformar os espaços culturais em ambientes mais inclusivos, deixando melhorias permanentes e fortalecendo o acesso à cultura para todas as pessoas.
                      - text: "CONFIRA A PROGRAMAÇÃO:"
                      - text: 📍 Sexta (26/06) – Casa Ziraldo de Cultura
                      - text: 🕘 19h – Abertura com exposição ”Tocar e Sentir” de Eni D’Carvalho, artista com 30 anos de trajetória em obras táteis e exposição na ONU.
                      - text: 🕘 20h – Apresentação musical de Leandro & Sandy, dupla sertaneja formada por irmãos com deficiência visual de São Sebastião do Antá.
                      - text: 📍 Sábado (27/06) – Praça da Estação
                      - text: 🕑 14h – Apresentação da APAE de Caratinga
                      - text: 🕑 14h às 19h – Espaço multissensorial de acolhimento para crianças atípicas
                      - text: "🕑 14h30 – Oficina Mini Chefs: O Mistério do Bolo de Chocolate"
                      - text: 🕒 15h – Oficina de Libras
                      - text: 🕓 16h – Momento solene com pronunciamentos
                      - text: "🕓 16h30 – TEAtrar: teatro inclusivo para autistas"
                      - text: "🕠 17h30 – Oficina Mini Chefs: Cozinhando uma Pizza Divertida"
                      - text: "🕠 17h30 – Danilo Bayão: viola raiz com o violeiro cego da Orquestra Mineira de Violas"
                      - text: "🕡 18h30 – Carlos Brum e banda: clássicos da música sertaneja raiz"
                      - text: "➕ Nos intervalos: DJ neurodivergente apresenta artistas com deficiência de todo o Brasil."
                      - text: "*Créditos: Roberta Carvalho"
