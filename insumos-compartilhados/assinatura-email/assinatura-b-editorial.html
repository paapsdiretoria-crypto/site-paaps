<meta charset="utf-8">
<title>Assinatura PAAPS - variante B (editorial)</title>
<link rel="stylesheet" href="base.css">
<style>
  .cartao {
    position:relative; width:620px; height:222px; overflow:hidden;
    background:var(--cor-fundo); border:1px solid var(--linha); border-radius:var(--raio);
    display:flex;
  }

  /* painel marrom: logo em branco (logo colorido em fundo escuro é proibido) */
  .painel {
    position:relative; flex:none; width:196px; background:var(--cor-marrom);
    display:flex; align-items:center; justify-content:center;
  }
  /* moldura editorial em creme, no lugar de textura */
  .painel .cerco {
    position:absolute; inset:14px 17px 14px 15px; border:1px solid rgba(245,241,225,0.20);
    border-radius:var(--raio);
  }
  .painel img.logo { position:relative; width:132px; display:block; }
  .painel .fita { position:absolute; top:0; right:0; bottom:0; width:3px; display:flex; flex-direction:column; }
  .painel .fita i { flex:1; }
  .painel .fita i:nth-child(1) { background:var(--cor-amarelo); }
  .painel .fita i:nth-child(2) { background:var(--cor-terracota); }
  .painel .fita i:nth-child(3) { background:var(--cor-oliva); }

  /* coluna editorial */
  .dados { flex:1; position:relative; padding:26px 26px 22px; display:flex; flex-direction:column; }
  .cabeca { position:relative; }
  .cabeca .label { display:block; margin-bottom:11px; }
  .risco { height:1px; background:var(--linha); margin:15px 0 14px; }
  .rodape { margin-top:auto; }
  .rodape .tricolor { margin-bottom:9px; }
</style>

<div class="cartao grao">
  <div class="painel">
    <span class="cerco"></span>
    <img class="logo" src="assets/logo-branco.png" alt="paaps">
    <span class="fita"><i></i><i></i><i></i></span>
  </div>

  <div class="dados">
    <div class="cabeca">
      <span class="label">Saúde mental coletiva</span>
      <div class="nome">Mallu Vasconcellos</div>
      <div class="cargo">CEO Founder &middot; Psicóloga social</div>
    </div>
    <div class="risco"></div>
    <div class="contatos">
      <div class="ln"><span class="mk t"></span>relacionamento@paaps.com.br</div>
      <div class="ln"><span class="mk a"></span>+55 11 99523-1724<span class="sep">|</span><span class="fraco">paaps.com.br</span></div>
      <div class="ln"><span class="mk o"></span>@paaps.brasil<span class="sep">|</span><span class="fraco">linkedin.com/company/paaps</span></div>
    </div>
    <div class="rodape">
      <div class="tricolor"><i></i><i></i><i></i></div>
      <span class="posicionamento">Prefeituras à prova de futuro</span>
    </div>
  </div>
</div>
