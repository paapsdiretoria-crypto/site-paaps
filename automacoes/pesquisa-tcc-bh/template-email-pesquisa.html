  NÃO é o molde da prospecção. Aqui não entra logo, marca, perfil de rede social, linha de
  posicionamento nem rodapé de descadastro: quem escreve é a pesquisadora, não a PAAPS.
  O molde comercial vive em automacoes/prospeccao-email/template-email.html e continua lá.

  Lacuna única: a marca do corpo, entre chaves duplas, mais abaixo, trocada pelo corpo da
  carta já convertido em <p>...</p>. Ela precisa aparecer UMA vez só no arquivo. Se for
  citada também aqui em cima, o script troca a citação e o e-mail sai com a marca crua no
  corpo. Aconteceu no primeiro teste da prospecção, em 26/07/2026.

  Tabela com estilo inline porque webmail de prefeitura ignora folha de estilo.
  Assinatura embutida por cid:assinatura, nunca por link externo: imagem de fora costuma
  vir bloqueada no Outlook do gov e chegaria como quadrado vazio. Por isso o contato
  também vai em texto logo abaixo dela.
-->
